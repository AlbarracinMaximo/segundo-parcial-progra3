<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Patitas PetShop</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="top-nav">
        <div class="nav-logo">
            <span class="logo-text">
                Patitas PetShop
            </span>
        </div>

        <!-- muestra el nombre del cliente recuperado desde sessionStorage mediante productos.js -->
        <div class="nav-team">
            <span id="clienteNombre"></span>
        </div>

        <div class="nav-buttons">
            <a href="carrito.html" class="btn-secondary">
                Ver Carrito
            </a>
            <a href="index.html" class="btn-secondary">
                Inicio
            </a>
        </div>

    </header>

    <main>

        <h1 class="titulo-productos">
            Nuestros Productos
        </h1>

        <div class="filtros">

            <select id="filtroCategoria">
                <option value="">
                    Todas las categorías
                </option>

                <option value="Alimentos">
                    Alimentos
                </option>

                <option value="Accesorios">
                    Accesorios
                </option>
            
            </select>

            <select id="filtroEspecie">
                <option value="">
                    Todas las especies
                </option>

                <option value="Perro">
                    Perro
                </option>

                <option value="Gato">
                    Gato
                </option>

            </select>

        </div>

        <!-- contenedor donde productos.js genera dinámicamente las tarjetas -->
        <div id="contenedorProductos"></div>

        <!-- contenedor utilizado para generar los botones de paginación -->
        <div id="paginacion"></div>

    </main>

    <script src="./js/productos.js"></script>

</body>

</html>
