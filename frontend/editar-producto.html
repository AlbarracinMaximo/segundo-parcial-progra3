<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>

    <link
        rel="stylesheet"
        href="./css/styles.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h2>Editar Producto</h2>

            <form id="editForm">

                <div class="form-group">
                    <label>Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                    >
                </div>

                <div class="form-group">
                    <label>Precio</label>
                    <input
                        type="number"
                        id="precio"
                    >
                </div>

                <div class="form-group">
                    <label>Stock</label>
                    <input
                        type="number"
                        id="stock"
                    >
                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Guardar Cambios
                </button>

            </form>

        </div>

    </div>

    <script src="./js/editar-producto.js"></script>

</body>

</html>
