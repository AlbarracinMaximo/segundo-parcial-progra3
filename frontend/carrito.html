<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <!-- barra superior de navegación -->
    <header class="top-nav">
        <div class="nav-logo">
            <span class="logo-text">
                Patitas PetShop
            </span>
        </div>
    </header>

<!-- contenido principal de la página -->
    <main>

        <h1 class="titulo-carrito">
            Mi Carrito
        </h1>

        <!-- contenedor vacio donde JavaScript insertará dinámicamente los productos -->
        <div id="contenedorCarrito"></div>

        <!-- muestra el importe total del carrito -->
        <h2 id="totalCarrito"></h2>

        <div class= "nav-buttons">
            <button id="btnFinalizar" class="btn-secondary">
                Finalizar Compra
            </button>
            <a href="productos.html" class="btn-secondary">
                Volver
            </a>
        </div>

    </main>

    <!-- carga el archivo JavaScript encargado de gestionar el carrito -->
    <script src="./js/carrito.js"></script>

</body>

</html>
