<!-- Este archivo representa la operacion CREATE (alta) del CRUD de productos -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto - Patitas PetShop</title>
    <link rel="icon" type="image/png" href="./assets/images/favicon.png">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- Barra superior de navegacion -->
    <header class="top-nav">

        <div class="nav-logo">
            <span class="logo-text">Patitas PetShop</span>
        </div>

        <div class="nav-team">
            <span>Alumnos: Juliana Sciaini & Máximo Albarracín</span>
        </div>

        <div class="nav-actions">
            <a href="./dashboard.html" class="btn-secondary">Volver al Dashboard</a>
        </div>

    </header>

    <!-- Tarjeta con el formulario de alta (reutiliza las clases de login y editar-producto) -->
    <main class="login-container">
        <section class="login-card">
            <h2>Nuevo Producto</h2>
            <p class="login-desc">Completa los datos para dar de alta un producto en el catalogo</p>
            <!-- El envio se intercepta desde alta-producto.js para mandar JSON via fetch POST a /api/productos -->
            <form id="altaForm">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Dog Chow Adulto 15kg" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Descripcion breve del producto" required></textarea>
                </div>

                <div class="form-group">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" min="1" step="0.01" placeholder="Ej: 45000" required>
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" min="0" placeholder="Ej: 10" required>
                </div>

                <div class="form-group">
                    <label for="imagen">Nombre de archivo de imagen</label>
                    <input type="text" id="imagen" placeholder="Ej: correa.jpg" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria">
                        <option value="Alimentos">Alimentos</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="especie">Especie</label>
                    <select id="especie">
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edad">Edad</label>
                    <select id="edad">
                        <option value="Cachorro">Cachorro</option>
                        <option value="Adulto">Adulto</option>
                        <option value="Senior">Senior</option>
                        <option value="Todos">Todos</option>
                    </select>
                </div>

                <!-- Contenedor donde alta-producto.js mostrara errores si falla la validacion -->
                <div id="altaError" class="alert-error" style="display: none;"></div>

                <button type="submit" class="btn-primary">
                    Agregar Producto
                </button>
            </form>
        </section>
    </main>
    <script src="./js/alta-producto.js"></script>
</body>
</html>
