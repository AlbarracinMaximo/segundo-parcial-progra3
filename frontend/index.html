<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patitas PetShop</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

<main class="welcome">

    <div class="hero-container">

        <section class="hero-content">

            <h1>
                Todo lo que tu mascota necesita
            </h1>

            <p class="subtitle">
                Ingresa tu nombre para iniciar la compra
            </p>

            <form id="welcomeForm">

                <input
                    type="text"
                    id="nombreCliente"
                    placeholder=""
                    required>

                <button type="submit">
                    Comprar productos
                </button>

            </form>

        </section>

        <section class="hero-image">

            <img
                src="./assets/images/gato-perro-welcome.png"
                alt="Mascotas">

        </section>

    </div>

</main>

    <script src="./js/welcome.js"></script>

</body>

</html>
