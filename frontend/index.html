<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patitas PetShop</title>

    <link
        rel="icon"
        type="image/png"
        href="./assets/favicon.png"
    >

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="top-nav">
        <div class="nav-logo">
            <span class="logo-text">
                Patitas PetShop
            </span>
        </div>

        <div class="nav-team">
            <span>Alumnos: Juliana Sciaini & Máximo Albarracín</span>
        </div>

        <div class="nav-actions">

            <a
                href="login.html"
                class="btn-admin-link"
            >
                Admin
            </a>

        </div>

    </header>

<main class="welcome">
    

    <div class="hero-container">

        <section class="hero-content">

            <h1>
                Todo lo que tu mascota necesita
            </h1>

            <p class="subtitle">
                Ingresa tu nombre para iniciar la compra
            </p>

            <!-- formulario encargado de capturar el nombre del cliente -->

            <form id="welcomeForm">

                <input
                    type="text"
                    id="nombreCliente"
                    placeholder="Ej: Juliana"
                    required>

                <button type="submit">
                    Comprar productos
                </button>

            </form>

        </section>

        <section class="hero-image">

            <img
                src="./assets/images/gato-perro-welcome.png"
                alt="Mascotas">

        </section>

    </div>

</main>

    <script src="./js/welcome.js"></script>

</body>

</html>
